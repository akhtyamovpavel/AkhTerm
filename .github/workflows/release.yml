name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.85.1

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Ubuntu build dependencies
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential dpkg-dev libfontconfig-dev libgtk-3-dev libvte-2.91-0

      - name: Run Rust tests
        run: cargo test --offline --locked

      - name: Build amd64 Debian package
        id: deb_package
        run: |
          ./packaging/build-deb.sh
          packages=(target/deb/akhterm_*_amd64.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          dpkg-deb --fsys-tarfile "${packages[0]}" \
            | tar -xOf - ./usr/share/doc/akhterm/OFL-Geist.txt \
            | cmp - assets/fonts/OFL-Geist.txt
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify installation on Ubuntu 24.04 and 26.04
        env:
          PACKAGE_PATH: ${{ steps.deb_package.outputs.path }}
        run: |
          package="$(realpath "$PACKAGE_PATH")"
          for version in 24.04 26.04; do
            echo "::group::Ubuntu $version"
            docker run --rm -i \
              --mount "type=bind,source=$package,target=/tmp/akhterm.deb,readonly" \
              "ubuntu:$version" bash -eu <<'CHECK'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends /tmp/akhterm.deb
          dpkg-query -W akhterm
          test -x /usr/bin/akhterm
          test -s /usr/share/applications/org.akhterm.AkhTerm.desktop
          test -s /usr/share/icons/hicolor/scalable/apps/org.akhterm.AkhTerm.svg
          /usr/bin/akhterm --version
          libraries="$(ldd /usr/bin/akhterm)"
          if grep -Fq 'not found' <<< "$libraries"; then
            echo "$libraries" >&2
            exit 1
          fi
          CHECK
            echo "::endgroup::"
          done

      - name: Build x86_64 Fedora RPM package
        id: rpm_package
        run: |
          rm -r -f -- target/release
          docker run --rm -i \
            -e RUSTUP_TOOLCHAIN \
            --mount "type=bind,source=$PWD,target=/workspace" \
            -w /workspace \
            fedora:41 bash -euo pipefail <<'BUILD'
          dnf install -y --setopt=install_weak_deps=False \
            cpio \
            desktop-file-utils \
            diffutils \
            fontconfig-devel \
            gcc \
            git-core \
            gtk3 \
            gtk3-devel \
            rpm-build \
            rustup \
            vte291-devel
          rustup-init -y --default-toolchain "$RUSTUP_TOOLCHAIN" --profile minimal --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH"
          desktop-file-validate packaging/org.akhterm.AkhTerm.desktop
          cargo test --offline --locked
          ./packaging/build-rpm.sh
          packages=(target/rpm/akhterm-*-1.x86_64.rpm)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          contents="$(rpm -qlp "${packages[0]}")"
          grep -Fxq '/usr/bin/akhterm' <<< "$contents"
          grep -Fxq '/usr/share/applications/org.akhterm.AkhTerm.desktop' <<< "$contents"
          grep -Fxq '/usr/share/icons/hicolor/scalable/apps/org.akhterm.AkhTerm.svg' <<< "$contents"
          grep -Fxq '/usr/share/doc/akhterm/config.example.conf' <<< "$contents"
          grep -Fxq '/usr/share/licenses/akhterm/LICENSE' <<< "$contents"
          grep -Fxq '/usr/share/licenses/akhterm/OFL-Geist.txt' <<< "$contents"
          grep -Fxq '/usr/share/licenses/akhterm/NOTICE' <<< "$contents"
          extract_dir="$(mktemp -d)"
          rpm2cpio "${packages[0]}" | cpio -id --quiet -D "$extract_dir"
          cmp -s "$extract_dir/usr/share/licenses/akhterm/OFL-Geist.txt" assets/fonts/OFL-Geist.txt
          cmp -s "$extract_dir/usr/share/licenses/akhterm/LICENSE" LICENSE
          cmp -s "$extract_dir/usr/share/licenses/akhterm/NOTICE" packaging/NOTICE
          cmp -s "$extract_dir/usr/share/doc/akhterm/config.example.conf" config.example.conf
          rm -r -f -- "$extract_dir"
          chown -R "$(stat -c '%u:%g' /workspace)" /workspace/target
          BUILD
          packages=(target/rpm/akhterm-*-1.x86_64.rpm)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify installation on Fedora 41 and 42
        env:
          PACKAGE_PATH: ${{ steps.rpm_package.outputs.path }}
        run: |
          package="$(realpath "$PACKAGE_PATH")"
          for version in 41 42; do
            echo "::group::Fedora $version"
            docker run --rm -i \
              --mount "type=bind,source=$package,target=/tmp/akhterm.rpm,readonly" \
              "fedora:$version" bash -euo pipefail <<'CHECK'
          dnf install -y /tmp/akhterm.rpm breeze-icon-theme breeze-gtk-gtk3 desktop-file-utils
          rpm -q akhterm
          test -x /usr/bin/akhterm
          test -s /usr/share/applications/org.akhterm.AkhTerm.desktop
          test -s /usr/share/icons/hicolor/scalable/apps/org.akhterm.AkhTerm.svg
          test -s /usr/share/licenses/akhterm/LICENSE
          test -s /usr/share/licenses/akhterm/OFL-Geist.txt
          test -s /usr/share/licenses/akhterm/NOTICE
          /usr/bin/akhterm --version
          desktop-file-validate /usr/share/applications/org.akhterm.AkhTerm.desktop
          libraries="$(ldd /usr/bin/akhterm)"
          if grep -Fq 'not found' <<< "$libraries"; then
            echo "$libraries" >&2
            exit 1
          fi
          CHECK
            echo "::endgroup::"
          done

      - name: Upload Debian installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-deb
          path: ${{ steps.deb_package.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Upload Fedora RPM installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rpm
          path: ${{ steps.rpm_package.outputs.path }}
          archive: false
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp target/deb/akhterm_*_amd64.deb target/rpm/akhterm-*-1.x86_64.rpm dist/
          (
            cd dist
            sha256sum akhterm_*_amd64.deb akhterm-*-1.x86_64.rpm > SHA256SUMS
          )
          gh release create "$GITHUB_REF_NAME" \
            dist/akhterm_*_amd64.deb \
            dist/akhterm-*-1.x86_64.rpm \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
